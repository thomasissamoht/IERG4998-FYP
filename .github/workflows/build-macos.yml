name: Build macOS Installer

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure build script is executable
        run: chmod +x installer/build_mac_setup.sh

      - name: Build macOS package (.app/.dmg)
        run: ./installer/build_mac_setup.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installer
          path: |
            installer/output/*.dmg
            installer/output/*.zip
          if-no-files-found: error
